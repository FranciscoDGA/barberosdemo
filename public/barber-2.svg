<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)"/>
  <!-- Head -->
  <circle cx="200" cy="180" r="70" fill="#334155"/>
  <!-- Body -->
  <ellipse cx="200" cy="380" rx="110" ry="140" fill="#334155"/>
  <!-- Scissors icon -->
  <g transform="translate(200,170)" fill="url(#accent2)" opacity="0.3">
    <ellipse cx="-15" cy="0" rx="12" ry="4" transform="rotate(-25)"/>
    <ellipse cx="15" cy="0" rx="12" ry="4" transform="rotate(25)"/>
    <circle cx="0" cy="0" r="4"/>
  </g>
  <!-- Initial -->
  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#f59e0b">L</text>
</svg>
